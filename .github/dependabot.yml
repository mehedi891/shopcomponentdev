version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      shopify:
        patterns:
          - "@shopify/*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
